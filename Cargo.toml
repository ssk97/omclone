[package]
name = "omclone"
version = "0.1.0"
edition = "2021"
default-run = "omclone"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["editor_ui"]
#choose one of the following
editor_ui = ["display_ui"]
display_ui = ["egui", "miniquad", "egui-miniquad", "image", "fontdue"]

[[bin]]
name="omclone"
required-features = ["display_ui"]
path = "src/main.rs"

#The omsim-style verifier library (see README)
[workspace]
members = ["verify"]

[profile.dev]
opt-level = 3
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true

#For the native verifier library, which is better fast than small
[profile.verify]
inherits = "release"
opt-level = 3

[target.'cfg(target_arch = "wasm32")'.dependencies]
sapp-jsutils = "0.1.5"

[dependencies]
slotmap = "1.0"
bitflags = "2"
nalgebra = "0.35"
num-traits = "0.2"
enum-primitive-derive = "0.3"
rustc-hash = "2"
smallvec = "1.10"


egui = {version = "0.35", optional = true}
miniquad = { version = "0.4.11", optional = true}
fontdue = { version = "0.9", optional = true}
#egui-miniquad = {version = "0.14", optional = true}
egui-miniquad = { path = "../egui-miniquad", optional = true }
image = {version = "0.25", optional = true, default-features = false, features = ["png"]}

#Errors are eyre's; color-eyre or simple-eyre reports them (see main.rs)
eyre = "0.6"
color-eyre = {version = "0.6", optional = true}
simple-eyre = "0.3"

[patch.crates-io]
miniquad = { path = "../miniquad" }
